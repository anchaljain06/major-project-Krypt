name: ci-frontend

on:
  push:
    paths:
      - "frontend/**"
      - "shared/**"
      - "evaluation/**"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "shared/**"
      - "evaluation/**"
      - ".github/workflows/ci-frontend.yml"

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            shared/package-lock.json

      # The frontend compiles ../shared/src directly (the @krypt/shared alias),
      # so shared needs its own node_modules too.
      - name: npm ci (shared)
        run: npm ci
        working-directory: shared
      - name: npm ci (frontend)
        run: npm ci

      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck:test
      - run: npm test

      # Known-answer tests. The trimmed vectors are committed; the two large
      # files (Wycheproof mlkem_1024 and mldsa_87_verify) are gitignored. They
      # are restored from the cache, or fetched on a cache miss. If the fetch
      # fails, their suites are skipped (describe.skipIf) and the rest still runs.
      - name: Restore large KAT vectors
        id: kat-cache
        uses: actions/cache@v4
        with:
          path: |
            frontend/test/vectors/wycheproof-mlkem-1024.json
            frontend/test/vectors/wycheproof-mldsa87-verify.json
          key: kat-vectors-v1-${{ hashFiles('frontend/scripts/fetch-vectors.sh', 'frontend/scripts/filter-vectors.mjs') }}
      - name: Fetch large KAT vectors (cache miss only)
        if: steps.kat-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        # Filter into a scratch directory and copy only the large files, so the
        # committed vectors are what the tests check, not today's upstream.
        run: |
          RAW="$RUNNER_TEMP/kat-raw" OUT="$RUNNER_TEMP/kat-out" npm run vectors:fetch
          cp "$RUNNER_TEMP/kat-out/wycheproof-mlkem-1024.json" "$RUNNER_TEMP/kat-out/wycheproof-mldsa87-verify.json" test/vectors/
      - run: npm run test:kat

  # evaluation/ imports frontend/src/crypto (E4, E5, E7) and frontend/test/helpers.ts,
  # so a frontend change can break the benchmarks without touching evaluation/.
  evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: evaluation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            evaluation/package-lock.json
      - name: npm ci (frontend)
        run: npm ci
        working-directory: frontend
      - run: npm ci
      - run: npm run typecheck
      - name: E5 byte accounting (real v1 handshake)
        run: npm run bytes -- --out "$RUNNER_TEMP/e5"
      - name: E7 quick grid (0 mismatches and 0 forward-secrecy breaks or it fails)
        run: npm run e7 -- --quick --out "$RUNNER_TEMP/e7"
