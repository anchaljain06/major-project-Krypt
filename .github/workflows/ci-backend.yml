name: ci-backend

on:
  push:
    paths:
      - "primary-backend/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    paths:
      - "primary-backend/**"
      - ".github/workflows/ci-backend.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: primary-backend
    env:
      # prisma.config.ts requires these; generate/build/unit tests never connect.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: primary-backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npm test
